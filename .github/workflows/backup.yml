name: Backup
# Build Plan p1-08: nightly D1 + R2 backup, kept off Cloudflare as an artifact, in a 7-Zip archive
# encrypted with AES-256 (file names too) under the BACKUP_PASSWORD secret (docs/STAGE-1-RUNBOOK.md).
# The repo is public, so the artifact is downloadable by anyone signed in to GitHub: never upload
# it unencrypted.
on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC, 06:17 in the UAE: the quietest hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: command -v 7z || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)

      - name: Check configuration
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ "${#BACKUP_PASSWORD}" -lt 24 ]; then echo "::error::Set the BACKUP_PASSWORD secret to a generated password of at least 24 characters"; exit 1; fi

      - name: Export D1 and R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.BACKUP_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
        run: node scripts/backup.mjs --remote --out "$RUNNER_TEMP/backup"

      - name: Encrypt
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          name="securityexile-$(date -u +%F)"
          # -mhe=on encrypts the file list too; -bso0 silences the progress output.
          cd "$RUNNER_TEMP/backup" && 7z a -t7z -mx=9 -mhe=on -bso0 -p"$BACKUP_PASSWORD" "$RUNNER_TEMP/$name.7z" .
          rm -rf "$RUNNER_TEMP/backup"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ runner.temp }}/${{ env.NAME }}.7z
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
